    <script>
        (function () {
            const BASE_SCROLL_DISTANCE_VH = 300;
            const SCROLL_PLAYBACK_FACTOR = 5; // > 1 slows playback (more scroll needed), < 1 speeds it up

            const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

            const configureScrollDistance = () => {
                const scrollSpace = document.getElementById('scroll-space');
                if (!scrollSpace) {
                    return;
                }

                const minHeightVh = 50;
                const heightVh = Math.max(minHeightVh, BASE_SCROLL_DISTANCE_VH * SCROLL_PLAYBACK_FACTOR);
                scrollSpace.style.height = `${heightVh}vh`;
            };

            const connectScrollPlayback = (player) => {
                const totalDuration = (() => {
                    if (Number.isFinite(player.maxFiniteDuration) && player.maxFiniteDuration > 0) {
                        return player.maxFiniteDuration;
                    }
                    if (player.iterations > 0) {
                        return player.duration * player.iterations;
                    }
                    return player.duration || 1;
                })();

                const update = () => {
                    const scrollRange = document.documentElement.scrollHeight - window.innerHeight;
                    const position = scrollRange > 0 ? window.scrollY / scrollRange : 0;
                    player.seekTo(totalDuration * clamp(position, 0, 1));
                };

                player.pause();
                player.seekTo(0);
                update();

                window.addEventListener('scroll', update, { passive: true });
                window.addEventListener('resize', () => {
                    configureScrollDistance();
                    update();
                });
            };

            const init = () => {
                configureScrollDistance();

                const svgElement = document.getElementById('tinyml_factory');
                if (!svgElement || !svgElement.svgatorPlayer) {
                    return;
                }

                svgElement.svgatorPlayer.ready(connectScrollPlayback);
            };

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init, { once: true });
            } else {
                init();
            }
        })();
    </script>
